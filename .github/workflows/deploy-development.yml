name: Deploy a AWS (development)

on:
  push:
    branches: [development]
  workflow_dispatch:

# Evita dos despliegues a la vez sobre el mismo estado.
concurrency:
  group: terraform-development
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Empaqueta la Lambda (código + plantillas + dependencias) antes de Terraform.
      - run: bash ../backend/build.sh

      - uses: hashicorp/setup-terraform@v3

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - run: terraform init -input=false

      - run: terraform validate

      - run: terraform plan -input=false -out=tfplan

      - run: terraform apply -input=false -auto-approve tfplan
